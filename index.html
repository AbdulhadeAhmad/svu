    html, body { height: 100%; }

      color: #2c3e50;
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #1f3a5f 0%, #2c5282 100%);

      padding: 14px 24px;

    header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
    header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .controls {
      background: #fff;
      padding: 12px 24px;
      border-bottom: 1px solid #e1e8ed;
      display: flex;
      gap: 22px;
      align-items: center;
      flex-wrap: wrap;
    }

    #search {
      padding: 7px 12px;
      border: 1px solid #d6dde4;
      border-radius: 6px;
      font-size: 13px;
      width: 260px;
      transition: border-color 0.15s;
    }
    #search:focus { outline: none; border-color: #3182ce; }

    .legend { display: flex; gap: 14px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4a5568; }
    .legend-color { width: 14px; height: 14px; border-radius: 3px; }

    .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
    .filters label {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: #4a5568; cursor: pointer; user-select: none;
      padding: 4px 8px; border-radius: 4px; transition: background 0.15s;
    }
    .filters label:hover { background: #edf2f7; }
    .filters input { cursor: pointer; margin: 0; }

    .layout { display: flex; height: calc(100vh - 100px); }

    .graph-wrap {
      flex: 1;
      overflow-x: scroll;
      overflow-y: auto;
      background:
        radial-gradient(circle at 20px 20px, #e8edf3 1px, transparent 1px) 0 0 / 40px 40px,
        #fbfcfd;
      position: relative;
    }
    .graph-wrap::-webkit-scrollbar { height: 12px; width: 12px; }
    .graph-wrap::-webkit-scrollbar-track { background: #edf2f7; border-radius: 6px; }
    .graph-wrap::-webkit-scrollbar-thumb { background: #a0aec0; border-radius: 6px; }
    .graph-wrap::-webkit-scrollbar-thumb:hover { background: #718096; }
    .graph-wrap svg { display: block; }

    aside {
      width: 360px;
      background: #fff;
      border-left: 1px solid #e1e8ed;
      padding: 20px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .info-empty { color: #95a5a6; text-align: center; padding: 60px 20px; font-size: 13px; }
    .info-empty svg { display: block; margin: 0 auto 14px; opacity: 0.3; }

    .info-head { margin-bottom: 18px; }
    .info-code {
      display: inline-block;
      padding: 3px 10px;
      background: #2c5282;
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }
    .info-title { font-size: 16px; font-weight: 600; color: #1a202c; line-height: 1.3; }
    .info-subtitle { font-size: 12px; color: #718096; margin-top: 4px; direction: rtl; text-align: right; }
    .info-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .meta-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; background: #edf2f7; border-radius: 12px;
      font-size: 11px; color: #4a5568;
    }

    .info-section { margin-top: 18px; }
    .info-section h3 {
      font-size: 11px; font-weight: 700; color: #4a5568;
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid #edf2f7; padding-bottom: 6px;
    }
    .chip-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      padding: 4px 8px; background: #f7fafc; border: 1px solid #e2e8f0;
      border-radius: 4px; font-size: 11px; cursor: pointer;
      transition: all 0.15s; color: #2d3748;
    }
    .chip:hover { background: #ebf8ff; border-color: #3182ce; color: #2c5282; }
    .chip.empty { color: #a0aec0; cursor: default; }
    .chip.empty:hover { background: #f7fafc; border-color: #e2e8f0; color: #a0aec0; }

    .info-desc {
      font-size: 12px; line-height: 1.6; color: #4a5568;
      background: #f7fafc; padding: 10px 12px; border-radius: 4px;
      border-left: 3px solid #cbd5e0;
    }

    /* SVG node styles */
    .node rect {
      stroke: #fff;
      stroke-width: 2;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.1));
      transition: filter 0.2s;
    }
    .node:hover rect { filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.18)); }
    .node text { font-family: inherit; pointer-events: none; }
    .node .code { font-size: 11px; font-weight: 700; fill: #fff; }
    .node .name {
      font-size: 9px; fill: #fff; opacity: 0.95;
      text-anchor: middle; dominant-baseline: middle;
    }
    .node.highlighted rect {
      stroke: #f6ad55;
      stroke-width: 3.5;
      filter: drop-shadow(0 0 8px rgba(246, 173, 85, 0.6));
    }
    .node.dimmed { opacity: 0.15; }
    .node.upstream-dim { opacity: 0.25; }
    .node.downstream-dim { opacity: 0.25; }

    .edge {
      stroke: #a0aec0;
      stroke-width: 1.4;
      fill: none;
      opacity: 0.55;
      transition: stroke 0.15s, opacity 0.15s;
    }
    .edge.highlighted { stroke: #ed8936; stroke-width: 2.5; opacity: 1; }
    .edge.dimmed { opacity: 0.06; }

    /* Zoom controls */
    .zoom-controls {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .zoom-btn {
      width: 30px; height: 30px;
      border: none; background: transparent;
      font-size: 16px; cursor: pointer;
      border-radius: 4px;
      color: #4a5568;
    }
    .zoom-btn:hover { background: #edf2f7; color: #2c5282; }
  </style>

      BPG601: 6, BCM601: 6, BPS601: 6, BSE601: 6, BID601: 6, BIS601: 6, BCG601: 6,
      BMM601: 6, BMP601: 6, BIA601: 6, BPR601: 6, BPR602: 6, BSM601: 6,
      GEN601: 6, GPM601: 6, GET601: 6, GEP601: 6,
      SSE602: 6, SDA601: 6, SAD601: 6, SDB601: 6, SDBL601: 6, SDE601: 6,
      SCP601: 6, SIR601: 6, SSW601: 6, SSQ601: 6,
      ANN601: 6, AVR601: 6, AML601: 6, ANL601: 6, AES601: 6, AIP601: 6, ACV601: 6,
      NCA601: 6, NNP601: 6, NNS601: 6, NNT601: 6, NOS601: 6, NOSL601: 6,
      NNM601: 6, NSS601: 6, NDS601: 6, NRT601: 6
    };

    // ===== Configuration =====
    const COLORS = {
      general: { fill: "#4299e1", stroke: "#2b6cb0" },
      basic:   { fill: "#48bb78", stroke: "#2f855a" },
      SE:      { fill: "#ed8936", stroke: "#c05621" },
      AI:      { fill: "#9f7aea", stroke: "#6b46c1" },
      SCN:     { fill: "#e53e3e", stroke: "#9b2c2c" }
    };

    const CATEGORY_LABELS = {
      general: "General",
      basic: "Basic",
      SE: "Software Eng.",
      AI: "Artificial Intelligence",
      SCN: "Systems & Networks"
    };

    // ===== Build data structures =====
    const subjectsById = {};
    subjectsData.forEach(s => {
      subjectsById[s.id] = {
        ...s,
        credits: creditsMap[s.id] || 0,
        lvl: levelMap[s.id] || 3
      };
    });

    // Build reverse graph: who depends on this subject
    const dependents = {};
    Object.values(subjectsById).forEach(s => {
      s.prereq.forEach(p => {
        if (!dependents[p]) dependents[p] = [];
        if (!dependents[p].includes(s.id)) dependents[p].push(s.id);
      });
    });

    // ===== Calculate levels (longest path from root) =====
    const levelOf = {};
    function calcLevel(id, visited = new Set()) {
      if (id in levelOf) return levelOf[id];
      if (visited.has(id)) return 0; // cycle
      visited.add(id);
      const s = subjectsById[id];
      if (!s || s.prereq.length === 0) {
        levelOf[id] = 0;
      } else {
        const prereqLevels = s.prereq
          .filter(p => subjectsById[p])
          .map(p => calcLevel(p, new Set(visited)));
        levelOf[id] = (prereqLevels.length ? Math.max(...prereqLevels) : -1) + 1;
      }
      return levelOf[id];
    }
    Object.keys(subjectsById).forEach(id => calcLevel(id));

    // ===== Layout =====
    const COL_WIDTH = 280;
    const ROW_HEIGHT = 72;
    const NODE_W = 150;
    const NODE_H = 52;
    const PADDING = 40;

    function buildLayout() {
      const groups = {}; // level -> [ids]
      Object.entries(levelOf).forEach(([id, lvl]) => {
        if (!groups[lvl]) groups[lvl] = [];
        groups[lvl].push(id);
      });
      // Sort each level by code for stability
      Object.values(groups).forEach(arr => arr.sort());

      const positions = {};
      let maxRows = 0;
      Object.entries(groups).forEach(([lvl, ids]) => {
        maxRows = Math.max(maxRows, ids.length);
        ids.forEach((id, i) => {
          positions[id] = {
            x: lvl * COL_WIDTH + PADDING,
            y: i * ROW_HEIGHT + PADDING
          };
        });
      });

      const maxLevel = Math.max(...Object.keys(groups).map(Number));
      const totalWidth = (maxLevel + 1) * COL_WIDTH + PADDING;
      const totalHeight = maxRows * ROW_HEIGHT + PADDING * 2;
      return { positions, groups, totalWidth, totalHeight };
    }

    // ===== SVG helpers =====
    const SVG_NS = "http://www.w3.org/2000/svg";
    function el(tag, attrs = {}, children = []) {
      const node = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
      children.forEach(c => node.appendChild(c));
      return node;
    }

    // ===== Render =====
    let currentLayout = null;
    let currentHighlight = null;
    let currentSearch = "";
    let activeFilters = new Set(["general", "basic", "SE", "AI", "SCN"]);

    function render() {
      const svg = document.getElementById("graph");
      svg.innerHTML = "";

      const layout = buildLayout();
      currentLayout = layout;
      svg.setAttribute("viewBox", `0 0 ${layout.totalWidth} ${layout.totalHeight}`);
      svg.setAttribute("width", layout.totalWidth);
      svg.setAttribute("height", layout.totalHeight);

      // Arrow marker
      const defs = el("defs");
      defs.appendChild(el("marker", {
        id: "arrow",
        viewBox: "0 0 10 10",
        refX: 9, refY: 5,
        markerWidth: 7, markerHeight: 7,
        orient: "auto-start-reverse"
      }, [el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#a0aec0" })]));
      defs.appendChild(el("marker", {
        id: "arrow-active",
        viewBox: "0 0 10 10",
        refX: 9, refY: 5,
        markerWidth: 7, markerHeight: 7,
        orient: "auto-start-reverse"
      }, [el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#ed8936" })]));
      svg.appendChild(defs);

      // Edges
      const edgesGroup = el("g", { id: "edges" });
      svg.appendChild(edgesGroup);

      Object.values(subjectsById).forEach(s => {
        s.prereq.forEach(p => {
          if (!layout.positions[p] || !layout.positions[s.id]) return;
          const from = layout.positions[p];
          const to = layout.positions[s.id];
          const x1 = from.x + NODE_W;
          const y1 = from.y + NODE_H / 2;
          const x2 = to.x;
          const y2 = to.y + NODE_H / 2;
          const dx = (x2 - x1) * 0.5;
          const path = el("path", {
            class: "edge",
            d: `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`,
            "data-from": p,
            "data-to": s.id
          });
          edgesGroup.appendChild(path);
        });
      });

      // Nodes
      const nodesGroup = el("g", { id: "nodes" });
      svg.appendChild(nodesGroup);

      Object.entries(layout.positions).forEach(([id, pos]) => {
        const s = subjectsById[id];
        const color = COLORS[s.cat] || COLORS.basic;
        const g = el("g", {
          class: "node",
          "data-id": id,
          transform: `translate(${pos.x}, ${pos.y})`
        });
        g.appendChild(el("rect", {
          x: 0, y: 0,
          width: NODE_W, height: NODE_H,
          rx: 6, ry: 6,
          fill: color.fill,
          stroke: color.stroke
        }));
        g.appendChild(el("text", {
          class: "code",
          x: NODE_W / 2, y: 17,
          "text-anchor": "middle"
        }, [document.createTextNode(s.id)]));
        // Truncate name
        let name = s.name;
        if (name.length > 24) name = name.slice(0, 22) + "…";
        g.appendChild(el("text", {
          class: "name",
          x: NODE_W / 2, y: 34
        }, [document.createTextNode(name)]));
        g.appendChild(el("text", {
          class: "name",
          x: NODE_W / 2, y: 46,
          style: "opacity: 0.85; font-size: 8px;"
        }, [document.createTextNode(`${s.credits} CR · L${s.lvl}`)]));

        g.addEventListener("click", () => selectSubject(id));
        g.addEventListener("mouseenter", () => highlightPath(id, true));
        g.addEventListener("mouseleave", () => highlightPath(id, false));
        nodesGroup.appendChild(g);
      });

      applyFilters();
    }

    // ===== Highlight a path =====
    function getUpstream(id) {
      const s = subjectsById[id];
      if (!s) return new Set();
      const result = new Set();
      function walk(x) {
        if (result.has(x)) return;
        result.add(x);
        const sub = subjectsById[x];
        if (sub) sub.prereq.forEach(p => { if (subjectsById[p]) walk(p); });
      }
      s.prereq.forEach(p => { if (subjectsById[p]) walk(p); });
      return result;
    }

    function getDownstream(id) {
      const result = new Set();
      function walk(x) {
        if (result.has(x)) return;
        result.add(x);
        (dependents[x] || []).forEach(d => walk(d));
      }
      walk(id);
      return result;
    }

    function highlightPath(id, on) {
      const svg = document.getElementById("graph");
      if (!on) {
        if (currentHighlight) currentHighlight = null;
        applyFilters();
        return;
      }
      currentHighlight = id;
      const upstream = getUpstream(id);
      upstream.add(id);
      const downstream = getDownstream(id);

      svg.querySelectorAll(".node").forEach(n => {
        const nid = n.getAttribute("data-id");
        n.classList.remove("highlighted", "dimmed", "upstream-dim", "downstream-dim");
        if (nid === id) n.classList.add("highlighted");
        else if (upstream.has(nid)) n.classList.add("downstream-dim");
        else if (downstream.has(nid)) n.classList.add("upstream-dim");
        else n.classList.add("dimmed");
      });
      svg.querySelectorAll(".edge").forEach(e => {
        const from = e.getAttribute("data-from");
        const to = e.getAttribute("data-to");
        e.classList.remove("highlighted", "dimmed");
        const inUpstream = upstream.has(from) && upstream.has(to);
        const inDownstream = downstream.has(from) && downstream.has(to);
        const involvesCenter = (from === id || to === id);
        if (inUpstream || inDownstream || involvesCenter) {
          e.classList.add("highlighted");
          e.setAttribute("marker-end", "url(#arrow-active)");
        } else {
          e.setAttribute("marker-end", "url(#arrow)");
        }
      });
    }

    function clearHighlight() {
      const svg = document.getElementById("graph");
      svg.querySelectorAll(".node").forEach(n => n.classList.remove("highlighted", "dimmed", "upstream-dim", "downstream-dim"));
      svg.querySelectorAll(".edge").forEach(e => {
        e.classList.remove("highlighted", "dimmed");
        e.setAttribute("marker-end", "url(#arrow)");
      });
    }

    function applyFilters() {
      const svg = document.getElementById("graph");
      svg.querySelectorAll(".node").forEach(n => {
        const id = n.getAttribute("data-id");
        const s = subjectsById[id];
        const cat = s.cat;
        const visible = activeFilters.has(cat);
        n.style.display = visible ? "" : "none";
      });
      svg.querySelectorAll(".edge").forEach(e => {
        const from = e.getAttribute("data-from");
        const to = e.getAttribute("data-to");
        const fromS = subjectsById[from];
        const toS = subjectsById[to];
        const visible = activeFilters.has(fromS.cat) && activeFilters.has(toS.cat);
        e.style.display = visible ? "" : "none";
      });
      if (currentSearch) applySearch();
    }

    function applySearch() {
      const svg = document.getElementById("graph");
      const q = currentSearch.toLowerCase().trim();
      if (!q) {
        svg.querySelectorAll(".node").forEach(n => {
          n.style.opacity = "";
        });
        return;
      }
      svg.querySelectorAll(".node").forEach(n => {
        const id = n.getAttribute("data-id");
        const s = subjectsById[id];
        const match = s.id.toLowerCase().includes(q) ||
                      s.name.toLowerCase().includes(q) ||
                      (s.nameAr || "").includes(q);
        n.style.opacity = match ? "1" : "0.15";
      });
    }

    // ===== Info panel =====
    function selectSubject(id) {
      const s = subjectsById[id];
      if (!s) return;
      const color = COLORS[s.cat];
      const catLabel = CATEGORY_LABELS[s.cat];
      const specList = s.spec && s.spec.length ? s.spec.join(", ") : "All specializations";

      const upstream = Array.from(getUpstream(id));
      const downstream = Array.from(getDownstream(id)).filter(d => d !== id);

      const prereqChips = s.prereq.length
        ? s.prereq.map(p => `<span class="chip" data-id="${p}">${p}</span>`).join("")
        : `<span class="chip empty">No prerequisites</span>`;

      const downChips = downstream.length
        ? downstream.map(d => `<span class="chip" data-id="${d}">${d}</span>`).join("")
        : `<span class="chip empty">No downstream courses</span>`;

      const concurrent = s.concurrent
        ? `<span class="chip" data-id="${s.concurrent}">${s.concurrent} (concurrent)</span>`
        : "";

      const extra = s.extra
        ? `<div class="info-section"><h3>Additional Requirement</h3><div class="info-desc">${s.extra}</div></div>`
        : "";

      const html = `
        <div class="info-head">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="info-code" style="background:${color.stroke}">${s.id}</span>
            <span class="meta-pill" style="background:${color.fill};color:#fff;">${catLabel}</span>
            <span class="meta-pill">${s.credits} Credits</span>
            <span class="meta-pill">Level ${s.lvl}</span>
          </div>
          <div class="info-title">${s.name}</div>
          <div class="info-subtitle">${s.nameAr || ""}</div>
          <div class="info-meta">
            <span class="meta-pill">📚 ${specList}</span>
            ${s.concurrent ? '<span class="meta-pill">🔄 Concurrent</span>' : ''}
            ${s.extra ? '<span class="meta-pill">⚠️ Special rule</span>' : ''}
          </div>
        </div>

        ${extra}

        <div class="info-section">
          <h3>Prerequisites (${s.prereq.length})</h3>
          <div class="chip-list">${prereqChips}</div>
        </div>

        ${concurrent ? `<div class="info-section">
          <h3>Concurrent With</h3>
          <div class="chip-list">${concurrent}</div>
        </div>` : ""}

        <div class="info-section">
          <h3>Unlocks (${downstream.length})</h3>
          <div class="chip-list">${downChips}</div>
        </div>
      `;

      const aside = document.getElementById("info");
      aside.innerHTML = html;

      aside.querySelectorAll(".chip[data-id]").forEach(chip => {
        chip.addEventListener("click", () => {
          const targetId = chip.getAttribute("data-id");
          const node = document.querySelector(`.node[data-id="${targetId}"]`);
          if (node) {
            node.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
            selectSubject(targetId);
            highlightPath(targetId, true);
          }
        });
      });
    }

    // ===== Build legend =====
    function buildLegend() {
      const el = document.getElementById("legend");
      Object.entries(COLORS).forEach(([cat, color]) => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `
          <div class="legend-color" style="background:${color.fill}"></div>
          <span>${CATEGORY_LABELS[cat]}</span>
        `;
        el.appendChild(item);
      });
    }

    // ===== Build filters =====
    function buildFilters() {
      const el = document.getElementById("filters");
      Object.keys(COLORS).forEach(cat => {
        const label = document.createElement("label");
        label.innerHTML = `
          <input type="checkbox" value="${cat}" checked />
          <span>${CATEGORY_LABELS[cat]}</span>
        `;
        label.querySelector("input").addEventListener("change", e => {
          if (e.target.checked) activeFilters.add(cat);
          else activeFilters.delete(cat);
          applyFilters();
        });
        el.appendChild(label);
      });
    }

    // ===== Search =====
    document.getElementById("search").addEventListener("input", e => {
      currentSearch = e.target.value;
      if (currentSearch) {
        clearHighlight();
        applySearch();
      } else {
        applyFilters();
      }
    });

    // ===== Zoom & pan =====
    const graphWrap = document.getElementById("graphWrap");
    let zoom = 1;
    const ZOOM_STEP = 0.15;
    function applyZoom() {
      const svg = document.getElementById("graph");
      svg.style.transformOrigin = "0 0";
      svg.style.transform = `scale(${zoom})`;
    }
    document.getElementById("zoomIn").addEventListener("click", () => {
      zoom = Math.min(2.5, zoom + ZOOM_STEP);
      applyZoom();
    });
    document.getElementById("zoomOut").addEventListener("click", () => {
      zoom = Math.max(0.3, zoom - ZOOM_STEP);
      applyZoom();
    });
    document.getElementById("zoomReset").addEventListener("click", () => {
      zoom = 1;
      applyZoom();
      graphWrap.scrollTo({ top: 0, left: 0, behavior: "smooth" });
    });
    graphWrap.addEventListener("wheel", e => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        if (e.deltaY < 0) zoom = Math.min(2.5, zoom + ZOOM_STEP);
        else zoom = Math.max(0.3, zoom - ZOOM_STEP);
        applyZoom();
      }
    }, { passive: false });

    // ===== Init =====
    buildLegend();
    buildFilters();
    render();
  </script>
</body>
</html>
