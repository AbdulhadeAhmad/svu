<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>ITE Subjects Graph - SVU</title>
  <link rel="stylesheet" href="style.css?v=28" />
</head>
<body data-catalog="ite_subjects.json">
  <header>
    <div class="logo">🎓</div>
    <div>
      <h1>ITE Subjects Prerequisite Graph</h1>
      <p>Syrian Virtual University · Bachelor in Information Technology Engineering</p>
    </div>
  </header>

  <div class="controls">
    <input disabled type="text" id="search" placeholder="Search by code or name…" />
    <div class="cat-filters" id="catFilters"></div>
    <button disabled id="langToggle" class="theme-toggle" title="Toggle language" type="button" aria-label="Toggle language">ع</button>
    <button disabled id="themeToggle" class="theme-toggle" title="Toggle dark/light theme" type="button" aria-label="Toggle theme">🌙</button>
    <button disabled id="importBtn" class="control-btn" title="Import your exam/assignments table from SVU">
      <span class="icon">↓</span> Import
    </button>
  </div>

  <div class="layout">
    <div class="graph-wrap" id="graphWrap">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
        <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
        <button class="zoom-btn" id="zoomReset" title="Reset zoom">⟳</button>
      </div>
    </div>
    <aside id="info">
      <details class="academic-rules" id="academicRules">
        <summary id="academicRulesTitle">Registration and grading rules</summary>
        <ul id="academicRulesList"></ul>
      </details>
      <div class="info-empty" id="infoEmpty">
        <div class="empty-icon">📚</div>
        <div class="empty-text">Loading course data…</div>
        <button disabled id="emptyImportBtn" class="btn btn-primary">↓ Import Exam History</button>
      </div>
      <section class="info-summary-section" id="summarySection" hidden>
        <button class="summary-toggle" id="summaryToggle" aria-expanded="true" type="button">
          <span class="summary-chev">▾</span>
          <span class="summary-toggle-label">Your Progress</span>
        </button>
        <div class="summary-body" id="summaryBody"></div>
      </section>
      <section class="info-detail-section" id="detailSection" hidden></section>
    </aside>
  </div>

  <!-- Import modal -->
  <div class="modal-overlay" id="importModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="importTitle">
      <div class="modal-header">
        <h2 id="importTitle">Import Exam History</h2>
        <button class="modal-close" id="modalCloseBtn" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-hint"></p>
        <textarea id="examTextarea" aria-label="Exam history table" placeholder="Paste your exam/assignments table here…"></textarea>
        <div class="parse-result" id="parseResult" hidden>
          <div class="parse-summary" id="parseSummary"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modalClearBtn" hidden>Clear data</button>
        <span class="modal-spacer"></span>
        <button class="btn btn-secondary" id="modalCancelBtn" data-i18n="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalParseBtn" data-i18n="modalParse">Parse</button>
        <button class="btn btn-success" id="modalApplyBtn" data-i18n="modalApply" hidden>Apply</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
